# RECAUDO-T — Render Blueprint
# Despliega el backend completo: dispatcher (+ monitor Ping/Echo y websocket),
# 3 réplicas y el cliente de carga en vivo (recaudo-t-client: web service cuyo
# /healthz lo mantiene despierto en free tier — fija CLIENT_RATE=5 req/s para no
# saturar las instancias free — y genera tráfico real para la vista Live).
# Frontend ya está en Vercel (recaudo-t-frontend.vercel.app).
#
# NOTA free tier: no se permiten background_worker en free (por eso el cliente
# es un web service) y las instancias free son lentas bajo carga sostenida:
# PING_TIMEOUT=1.0 evita falsos CAÍDA (t=0.3 local es correcto, pero las
# instancias free llegan a superar los 300ms de respuesta al ping).

services:
  - type: web
    name: recaudo-t-dispatcher
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /estado
    autoDeploy: true
    envVars:
      - key: DISPATCHER_HOST
        value: 0.0.0.0
      - key: DISPATCHER_PORT
        value: "8000"
      - key: PING_INTERVAL
        value: "1"
      - key: PING_TIMEOUT
        value: "1.0"
      - key: FAILURE_THRESHOLD
        value: "2"
      - key: RECOVERY_THRESHOLD
        value: "2"
      - key: REPLICA_A_URL
        value: https://recaudo-t-replica-a.onrender.com
      - key: REPLICA_B_URL
        value: https://recaudo-t-replica-b.onrender.com
      - key: REPLICA_C_URL
        value: https://recaudo-t-replica-c.onrender.com

  - type: web
    name: recaudo-t-replica-a
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: REPLICA_HOST
        value: 0.0.0.0
      - key: REPLICA_PORT
        value: "8001"
      - key: REPLICA_ID
        value: A

  - type: web
    name: recaudo-t-replica-b
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: REPLICA_HOST
        value: 0.0.0.0
      - key: REPLICA_PORT
        value: "8001"
      - key: REPLICA_ID
        value: B

  - type: web
    name: recaudo-t-replica-c
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /ping
    autoDeploy: true
    envVars:
      - key: REPLICA_HOST
        value: 0.0.0.0
      - key: REPLICA_PORT
        value: "8001"
      - key: REPLICA_ID
        value: C

  - type: web
    name: recaudo-t-client
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: CLIENT_DISPATCHER_URL
        value: https://recaudo-t-dispatcher.onrender.com
      - key: CLIENT_RATE
        value: "5"
      - key: REQUEST_TIMEOUT
        value: "1.2"